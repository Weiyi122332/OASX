name: Validate OASX
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Regression tests
        run: >-
          flutter test --concurrency=1 test/illustration_test.dart test/log_api_regression_test.dart test/error_report_test.dart test/error_analysis_widget_test.dart
          test/script_analysis_models_test.dart test/script_log_browser_error_render_test.dart
          test/script_log_browser_error_detail_render_test.dart test/script_log_browser_copy_test.dart
          test/script_log_browser_resume_policy_test.dart test/file_save_io_test.dart
